name: Permissions Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permission-probe:
    permissions:
      contents: write
      
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Attempt repository write
        run: |
          TAG="permissions-lab-${GITHUB_RUN_ID}"

          git tag "${TAG}"
          git push origin "${TAG}"